<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent POC</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="conversation-sidebar" aria-label="Conversations">
        <button id="newConversationButton" class="secondary-button new-conversation-button" type="button">
          New Conversation
        </button>
        <div id="conversationList" class="conversation-list"></div>
      </aside>

      <section class="panel">
        <div>
          <p class="eyebrow">Voice Agent POC</p>
          <h1>Whisper + NanoGPT Voice Agent</h1>
        </div>

        <button id="recordButton" class="record-button" type="button">
          Start Recording
        </button>

        <div class="tts-controls">
          <label class="tts-toggle">
            <input id="speakReplies" type="checkbox" checked />
            <span>Speak replies</span>
          </label>
          <button id="stopSpeakingButton" class="secondary-button" type="button" hidden>
            Stop speaking
          </button>
        </div>

        <div class="status-row">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Ready</span>
        </div>

        <section class="chat-panel" aria-live="polite" aria-label="Conversation history">
          <div id="emptyState" class="empty-state">
            Record a short sample to start this conversation.
          </div>
          <div id="chatMessages" class="chat-messages"></div>
        </section>

        <p id="metadata" class="metadata"></p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
