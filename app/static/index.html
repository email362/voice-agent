<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent POC</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div>
          <p class="eyebrow">Voice Agent POC</p>
          <h1>Whisper + NanoGPT Voice Agent</h1>
        </div>

        <button id="recordButton" class="record-button" type="button">
          Start Recording
        </button>

        <div class="tts-controls">
          <label class="tts-toggle">
            <input id="speakReplies" type="checkbox" checked />
            <span>Speak replies</span>
          </label>
          <button id="stopSpeakingButton" class="secondary-button" type="button" hidden>
            Stop speaking
          </button>
        </div>

        <div class="status-row">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Ready</span>
        </div>

        <section class="transcript-panel" aria-live="polite">
          <h2>Transcript</h2>
          <p id="transcript" class="transcript-placeholder">
            Record a short sample to see Whisper output here.
          </p>
        </section>

        <section class="transcript-panel assistant-panel" aria-live="polite">
          <h2>Assistant Reply</h2>
          <p id="assistantReply" class="transcript-placeholder">
            The assistant reply will appear here after transcription.
          </p>
        </section>

        <p id="metadata" class="metadata"></p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
